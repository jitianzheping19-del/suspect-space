import * as T from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';

box(1.55,2.05,.45,.23,2.1,.3,metal,-.34);box(1.55,2.8,.45,.36,1.7,.23,dark,-.34);box(1.55,2.8,.59,.08,1.65,.05,purple,-.34);box(1.55,2.16,.45,1,.16,.4,metal,-.34);gem(1.55,2.16,.65,.2);
