<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>イビルゲッサー・プレビュー</title><link rel="stylesheet" href="./session-game-ui.css"><style>html,body{margin:0;min-height:100%;background:#07111e;color:#eff7ff;font-family:system-ui,sans-serif}*{box-sizing:border-box}button{font:inherit;color:inherit;cursor:pointer}#guesserPanel{position:fixed;inset:0;display:grid;place-items:center}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}#guesserClose{background:#21344a;border:1px solid #607f96;border-radius:9px;padding:10px 14px}.hidden{display:none!important}</style></head><body>
<section id="guesserPanel" role="dialog" aria-modal="true" aria-labelledby="guesserTitle"><div class="card guesserCard"><div class="row"><h2 id="guesserTitle">役職を推理</h2><button id="guesserClose" type="button">キャンセル</button></div><p id="guesserTargetName"></p><p class="guesserCaution">外れると自分が退場します。</p><div id="guesserRoleList"></div><button id="guesserConfirm" type="button" disabled>役職を選択</button></div></section>
<script type="module">import{mountGuesserPicker}from'./guesser-dialog.js';const panel=document.getElementById('guesserPanel');const roles=[['sheriff','シェリフ','crew'],['medic','メディック','crew'],['engineer','エンジニア','crew'],['samurai','侍','impostor'],['vampire','ヴァンパイア','impostor'],['evilGuesser','イビルゲッサー','impostor'],['jackal','ジャッカル','third'],['arsonist','アーソニスト','third'],['jester','ジェスター','third']].map(([id,name,side])=>({id,name,side}));const reset=()=>mountGuesserPicker({panel,target:{name:'レモン'},roles,evil:true,onConfirm:()=>{document.getElementById('guesserConfirm').textContent='プレビュー：推理を選択しました';setTimeout(reset,1200)}});document.getElementById('guesserClose').onclick=reset;reset();</script></body></html>
