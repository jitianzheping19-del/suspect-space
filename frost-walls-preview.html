<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#0a1522">
    <title>FROST — マップ・タスクプレビュー</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath d='M9 5h23v7H17v7h12v7H17v10H9z' fill='%2395e4e0'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="./frost-walls-preview.css">
    <script type="importmap">
      {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}
    </script>
  </head>
  <body>
    <main id="app" data-mode="overview">
      <div id="stage" aria-label="FROSTの3Dプレビュー"></div>
      <header class="toolbar">
        <div class="identity"><h1>FROST</h1><span>氷衛星研究基地</span></div>
        <nav class="views" aria-label="表示切り替え">
          <button type="button" data-view="overview" aria-pressed="true">全体</button>
          <button type="button" data-view="top" aria-pressed="false">真上</button>
          <button type="button" data-view="walk" aria-pressed="false">歩く</button>
        </nav>
      </header>
      <div class="walk-tools">
        <label class="room-picker"><span class="sr-only">移動する部屋</span><select id="roomPicker" aria-label="移動する部屋"></select></label>
        <label class="sabotage-picker"><span class="sr-only">妨害プレビュー</span><select id="sabotageType" aria-label="妨害プレビュー"><option value="">妨害なし</option><option value="oxygen">酸素</option><option value="lights">停電</option><option value="reactor">冷却炉異常</option><option value="comms">通信障害</option></select></label>
        <button id="fullscreen" type="button" aria-label="全画面表示" title="全画面表示">⛶</button>
      </div>
      <div id="sabotageStatus" role="status" hidden></div>
      <div id="meetingSignal" role="status" hidden>緊急会議</div>
      <div class="caption" aria-live="polite"><span id="location">氷衛星研究基地</span><span id="hint">ドラッグで回転 · スクロールで拡大</span></div>
      <div id="joystick" aria-label="移動ジョイスティック" role="group"><div class="stick-ring"></div><div id="stickThumb"></div></div>
      <div class="reticle" aria-hidden="true"></div>
      <div id="taskAction" hidden><span id="nearbyTask"></span><button id="useTask" type="button" disabled>使用</button></div>
      <div id="ventShade" aria-hidden="true" hidden></div>
      <section id="ventPanel" aria-label="ベント" hidden>
        <header><strong id="ventLocation"></strong><span>ベント内</span></header>
        <div id="ventDestinations"></div>
        <button id="ventExit" type="button">出る</button>
      </section>
      <dialog id="taskModal" aria-labelledby="taskTitle" aria-describedby="taskHint">
        <header class="task-header"><div><span id="taskRoom"></span><h2 id="taskTitle"></h2></div><p id="taskHint"></p></header>
        <div id="taskStage"></div>
        <div class="task-progress" aria-hidden="true"><div id="taskProgressFill"></div></div>
        <footer class="task-footer"><button id="taskClose" type="button">閉じる</button><span id="taskFeedback" role="status"></span></footer>
      </dialog>
      <div id="status" role="status">読み込み中…</div>
      <noscript>プレビューを表示するにはJavaScriptを有効にしてください。</noscript>
    </main>
    <script type="module" src="./frost-walls-preview.js"></script>
  </body>
</html>
