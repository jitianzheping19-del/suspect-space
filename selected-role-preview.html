<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>追加役職の演出 — SPACE SUSPECT</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07121e;color:#eaf6fa;font:14px system-ui,sans-serif;overflow:hidden}button,select,input{font:inherit;color:inherit}button,select{background:#122c3e;border:1px solid #789caa66;border-radius:9px;padding:9px 13px}button{cursor:pointer}button[aria-pressed=true]{background:#204957;border-color:#94e2eb;color:#fff}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #b3efff;outline-offset:3px}header{position:fixed;top:max(16px,env(safe-area-inset-top));left:max(18px,env(safe-area-inset-left));right:max(18px,env(safe-area-inset-right));z-index:3;display:flex;align-items:center;gap:18px}h1{font-size:17px;margin:0;white-space:nowrap}nav{display:flex;gap:6px;overflow-x:auto;padding:4px}nav button{white-space:nowrap;flex:none}main{position:fixed;inset:75px 0 100px;isolation:isolate}footer{position:fixed;left:max(18px,env(safe-area-inset-left));right:max(18px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));z-index:3;display:grid;gap:9px}.controls,.wardrobe{display:flex;align-items:center;gap:10px}.controls input{flex:1;min-width:50px;accent-color:#90e2ec}.controls output{width:42px;font-variant-numeric:tabular-nums}.wardrobe select{max-width:30vw;font-size:12px;padding:6px 10px}.wardrobe label{display:flex;align-items:center;gap:7px}#error{position:fixed;left:20px;top:100px;color:#ffbdac;z-index:5}#error:empty{display:none}@media(max-height:540px){header{top:8px;gap:9px}h1{font-size:13px}nav button{padding:6px 9px;font-size:12px}main{inset:54px 0 88px}footer{bottom:max(8px,env(safe-area-inset-bottom));gap:6px}.controls button{padding:6px 10px}.wardrobe label{font-size:11px}}@media(max-width:600px){header{display:block}h1{font-size:14px;margin:0 0 5px}nav{padding:2px 0}nav button{font-size:12px;padding:7px 10px}main{inset:90px 0 115px}.wardrobe{flex-wrap:wrap;gap:7px}.wardrobe select{max-width:32vw}}
</style></head><body>
<header><h1>追加役職の演出</h1><nav aria-label="役職"></nav></header>
<main id="stage"></main><p id="error" role="alert"></p>
<footer><div class="wardrobe"><label>使用者<select id="killerCostume"><option value="standard">通常</option><option value="premium-abyssdiver">潜航士</option><option value="premium-sakurakimono">桜花</option><option value="premium-retroarcade">アーケード</option></select></label><label>対象者<select id="victimCostume"><option value="standard">通常</option><option value="premium-abyssdiver">潜航士</option><option value="premium-sakurakimono">桜花</option><option value="premium-retroarcade">アーケード</option></select></label><label><input type="checkbox" id="sound">効果音</label></div>
<div class="controls"><button id="play">再生</button><button id="replay">最初から</button><input id="time" type="range" min="0" max="2.05" step=".01" value="0" aria-label="再生位置"><output id="seconds">0.0s</output></div></footer>
<script type="module">
import {createAuthoredKillPlayer,authoredKillSpec} from './authored-kill-player.js';
const $=id=>document.getElementById(id),roles=[['fencer','フェンサー'],['bait','ベイト'],['evolver','エボルバー'],['bomber','ボマー'],['boxer','ボクサー']];
let assets,role=roles.some(([id])=>id===new URL(location.href).searchParams.get('role'))?new URL(location.href).searchParams.get('role'):'fencer',time=0,playing=false,last=performance.now(),duration=2.05;
const player=createAuthoredKillPlayer({mount:$('stage'),onError:message=>{$('error').textContent=message;playing=false;},onDone:()=>{playing=false;$('play').textContent='再生';}});
function configure(){if(!assets)return;playing=false;time=0;$('play').textContent='再生';$('time').value=0;$('seconds').textContent='0.0s';duration=authoredKillSpec(assets,role).duration;$('time').max=String(duration);player.configure(assets,role,{id:crypto.randomUUID(),useGameCharacter:true,killerName:role==='bait'?'通報者':'使用者',victimName:role==='bait'?'死亡者':'対象者',killerColor:'#ee5368',victimColor:'#46c4e6',killerCostume:$('killerCostume').value,victimCostume:$('victimCostume').value,volume:$('sound').checked?.5:0},false);player.show(true);player.seek(0);document.querySelectorAll('[data-role]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.role===role)));}
for(const[id,label]of roles){const b=document.createElement('button');b.dataset.role=id;b.textContent=label;b.onclick=()=>{role=id;configure();};document.querySelector('nav').append(b);}
$('play').onclick=()=>{if(!assets)return;if(time>=duration-.03){configure();time=0;}playing=!playing;last=performance.now();$('play').textContent=playing?'停止':'再生';};$('replay').onclick=()=>{configure();playing=true;last=performance.now();$('play').textContent='停止';};
$('time').oninput=()=>{playing=false;time=Number($('time').value);$('play').textContent='再生';$('seconds').textContent=time.toFixed(1)+'s';player.seek(time,false);};for(const id of ['killerCostume','victimCostume'])$(id).onchange=configure;$('sound').onchange=()=>player.setVolume($('sound').checked?.5:0);
function frame(stamp){requestAnimationFrame(frame);const dt=Math.min(.1,(stamp-last)/1000);last=stamp;if(document.hidden||!playing)return;time=Math.min(duration-.03,time+dt);player.seek(time,$('sound').checked);$('time').value=String(time);$('seconds').textContent=time.toFixed(1)+'s';if(time>=duration-.03){playing=false;$('play').textContent='再生';}}
document.addEventListener('visibilitychange',()=>{last=performance.now();});
try{const response=await fetch(new URL('./kill-originals.json',location.href));if(!response.ok)throw Error('演出データを読み込めません');assets=await response.json();configure();requestAnimationFrame(frame);}catch(error){$('error').textContent=error.message;}
</script></body></html>
