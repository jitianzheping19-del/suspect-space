<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>波動砲 | SPACE SUSPECT</title><style>*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#091421;color:#e9f8ff;font-family:system-ui,sans-serif}canvas{display:block;touch-action:none}.bar{position:fixed;left:max(10px,env(safe-area-inset-left));top:10px;z-index:2;display:flex;align-items:center;gap:8px;padding:8px;background:#091a2be8;border:1px solid #486e85;border-radius:12px}button{background:#17384d;border:1px solid #7bcddd;border-radius:8px;padding:8px 12px;color:#e9fcff;font:600 14px system-ui}input{width:min(35vw,280px);accent-color:#76e5ff}#clock{font-size:13px;font-variant-numeric:tabular-nums;width:65px}#status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%)}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script></head><body><div class="bar"><button id="play">一時停止</button><button id="restart">もう一度</button><button id="device">装置を見る</button><input id="seek" type="range" min="0" max="7" step=".01" value="0" aria-label="再生位置"><span id="clock">0.0 / 7.0</span></div><div id="status">読み込み中</div><script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {createWaveCannonEffect,waveCannonTargetOnBeam,WAVE_CANNON_DEVICE_FORWARD} from './wave-cannon-runtime.js';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0e2131);scene.add(new THREE.HemisphereLight(0xe5f5ff,0x30405c,2));for(const [x,y,z,c,i]of[[-5,8,-2,0xd6f0ff,3],[5,5,10,0xffe1bd,2]]){const l=new THREE.DirectionalLight(c,i);l.position.set(x,y,z);scene.add(l)}const floor=new THREE.Mesh(new THREE.PlaneGeometry(80,150),new THREE.MeshStandardMaterial({color:0x142b3c,roughness:.8}));floor.rotation.x=-Math.PI/2;floor.position.z=30;scene.add(floor);const grid=new THREE.GridHelper(100,50,0x2f5467,0x1a394d);grid.position.set(0,.005,30);scene.add(grid);
const camera=new THREE.PerspectiveCamera(48,1,.05,200);camera.position.set(10,12,14);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,0,5);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.48;controls.minDistance=2;controls.maxDistance=70;controls.update();
const avatars=new Map(),targets=[];function crew(x,z,color,id){const root=new THREE.Group(),suit=new THREE.MeshStandardMaterial({color,roughness:.5}),body=new THREE.Mesh(new THREE.CapsuleGeometry(.31,.45,5,12),suit);body.position.y=.85;root.add(body);const visor=new THREE.Mesh(new THREE.SphereGeometry(.27,16,10),new THREE.MeshStandardMaterial({color:0xa7d5e5,roughness:.2,metalness:.2}));visor.position.set(0,1.03,.27);visor.scale.set(1,.60,.45);root.add(visor);for(const side of[-1,1]){const foot=new THREE.Mesh(new THREE.CapsuleGeometry(.12,.18,4,8),suit);foot.position.set(side*.18,.23,0);root.add(foot)}root.position.set(x,0,z);root.userData.arms=[new THREE.Group(),new THREE.Group()];root.userData.arms.forEach((a,i)=>{a.position.set(i?.34:-.34,1.05,0);const segment=new THREE.Mesh(new THREE.CapsuleGeometry(.085,.27,4,8),suit);segment.position.y=-.10;a.add(segment);root.add(a)});scene.add(root);avatars.set(id,root);return{root,suit,x,z};}
crew(0,0,0xd9c465,'owner');for(const [i,x,z]of[[0,2.6,6],[1,4.4,6],[2,-2.6,12],[3,-4.4,12],[4,0,18]])targets.push(crew(x,z,0x86aaab,'t'+i));
const wave={id:'preview',by:'owner',x:0,z:0,yaw:0,startedAt:1000,fireAt:3000,endsAt:8000};let fx,time=0,paused=false,last=0;function restart(){fx?.dispose();fx=createWaveCannonEffect({THREE,scene,event:wave,getAvatar:id=>avatars.get(id)});time=0;paused=false;document.getElementById('play').textContent='一時停止'}restart();document.getElementById('status').hidden=true;
function at(value){time=Math.max(0,Math.min(7000,value));fx.root.visible=fx.update(1000+time);targets.forEach(t=>{const hit=time>=2000&&waveCannonTargetOnBeam(wave,t,Math.min(1,(time-2000)/450));t.suit.color.setHex(hit?0xe06973:0x78bdaa)});controls.update();renderer.render(scene,camera);document.getElementById('seek').value=time/1000;document.getElementById('clock').textContent=(time/1000).toFixed(1)+' / 7.0'}
document.getElementById('play').onclick=()=>{paused=!paused;document.getElementById('play').textContent=paused?'再生':'一時停止'};document.getElementById('restart').onclick=restart;let deviceView=false;document.getElementById('device').onclick=e=>{deviceView=!deviceView;if(deviceView){camera.position.set(2.4,1.8,3.2+WAVE_CANNON_DEVICE_FORWARD);controls.target.set(0,.60,-.4+WAVE_CANNON_DEVICE_FORWARD);}else{camera.position.set(10,12,14);controls.target.set(0,0,5);}controls.update();e.target.textContent=deviceView?'射線を見る':'装置を見る'};document.getElementById('seek').oninput=e=>{paused=true;document.getElementById('play').textContent='再生';at(Number(e.target.value)*1000)};function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);resize();renderer.setAnimationLoop(t=>{const dt=Math.min(50,t-last||16);last=t;if(document.hidden)return;if(!paused){time+=dt;if(time>=7000)restart()}at(time)});window.__wavePreview={at:value=>{paused=true;at(value)},fx,scene,renderer,camera,controls};
</script></body></html>
