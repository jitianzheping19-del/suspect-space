<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ガチャ演出プレビュー</title><link rel="stylesheet" href="./gacha-ui.css"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script></head><body style="margin:0;background:#091722;color:white"><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';import {createGachaUI} from './gacha-ui.js';import {GACHA_CATALOG} from './gacha-catalog.js';import {createGiftSkin} from './premium-skins.js';
let wallet={tickets:50,premium:8,owned:{}};let index=0;
const ui=createGachaUI(THREE,{canOpen:()=>true,wallet:async()=>wallet,draw:async({kind,category,count=1})=>{const pool=GACHA_CATALOG.filter(i=>kind==='premium'?i.category===5:i.category===category);const items=Array.from({length:count},()=>pool[index++%pool.length]);wallet[kind==='premium'?'premium':'tickets']-=count;for(const item of items)wallet.owned[item.number]=true;return{wallet,item:items[0],items};},equip:async()=>{},preview:(item,el)=>{if(item.category!==5){el.style.display='grid';el.style.placeItems='center';el.style.fontSize='80px';el.textContent=item.glyph;return()=>{el.textContent='';};}const r=new THREE.WebGLRenderer({alpha:true,antialias:false});r.setSize(200,200,false);el.append(r.domElement);const s=new THREE.Scene(),c=new THREE.PerspectiveCamera(38,1,.1,30);c.position.set(3,2.6,6);c.lookAt(0,1.2,0);s.add(new THREE.HemisphereLight(0xffffff,0x39435e,3));const l=new THREE.DirectionalLight(0xffffff,3);l.position.set(3,5,5);s.add(l);const suit=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.48,5,10),new THREE.MeshStandardMaterial({color:0x8294ab}));suit.position.y=1;s.add(suit);const skin=createGiftSkin(THREE,item.id,{mobile:true});s.add(skin.group);let frame,alive=true;function tick(ms){if(!alive)return;skin.group.rotation.y=ms*.0004;skin.update(ms*.001,{});r.render(s,c);frame=requestAnimationFrame(tick);}frame=requestAnimationFrame(tick);return()=>{alive=false;cancelAnimationFrame(frame);skin.dispose();suit.geometry.dispose();suit.material.dispose();r.dispose();r.forceContextLoss();};}});window.gachaPreview=ui;ui.open();
</script></body></html>
