<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ペット | SPACE SUSPECT</title><style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0d1b2a;color:#e9f6fa;font-family:system-ui,sans-serif}canvas{display:block;touch-action:none}.bar{position:fixed;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));z-index:2;display:flex;gap:8px;padding:8px;border:1px solid #456477;border-radius:14px;background:#0a1b2cdd}select,button{color:#e4f3f7;font:600 14px system-ui;background:#142e41;border:1px solid #5d8294;border-radius:8px;padding:9px 12px}button[aria-pressed=true]{background:#1b6158;border-color:#7cdcca}#status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%)}@media(max-height:480px){.bar{top:6px;left:6px;padding:5px}select,button{font-size:12px;padding:7px 9px}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script></head><body><div class="bar"><select id="pet" aria-label="ペット"></select><button id="walk" aria-pressed="false">歩く</button><button id="rotate" aria-pressed="false">回す</button></div><div id="status">読み込み中</div><script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const {buildLightCostume,animateCompanionGait}=await import(/* @vite-ignore */new URL('pet-models-preview.js',document.baseURI).href);
const pets={hamster:'ハムスター',cat:'ネコ',dog:'イヌ',fox:'キツネ',rabbit:'ウサギ',panda:'パンダ',penguin:'ペンギン',parrot:'インコ',owl:'フクロウ',dragon:'ドラゴン',axolotl:'ウーパールーパー',turtle:'カメ',slime:'スライム',drone:'ドローン',robot:'ロボット',rover:'ローバー',lifebuoy:'浮き輪',pfsh:'金魚',pshk:'サメ',pjel:'クラゲ',pfrg:'カエル',pbat:'コウモリ',pmus:'ネズミ',pwol:'オオカミ',pshp:'ヒツジ',pgeo:'地球',pgho:'ゴースト',pcld:'雲',pstr:'スター',pbal:'風船',pdol:'マトリョーシカ',pmsh:'キノコ',pbrd:'小鳥',pcub:'キューブ',phrt:'ハート',pflm:'炎',pice:'氷'};
const select=document.getElementById('pet');for(const [value,label]of Object.entries(pets)){const o=document.createElement('option');o.value=value;o.textContent=label;select.append(o)}
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x102234);scene.add(new THREE.HemisphereLight(0xe3f5ff,0x4d5148,2));for(const [x,y,z,c,i]of[[-2,3,4,0xffe8c8,3],[3,2,-2,0xa4dfff,2.5]]){const l=new THREE.DirectionalLight(c,i);l.position.set(x,y,z);scene.add(l)}
const floor=new THREE.Mesh(new THREE.CircleGeometry(8,64),new THREE.MeshStandardMaterial({color:0x162f43,roughness:.8}));floor.rotation.x=-Math.PI/2;floor.position.y=-.005;scene.add(floor);
const a=new Uint8Array(64*64*4);for(let y=0;y<64;y++)for(let x=0;x<64;x++){const i=(y*64+x)*4,d=Math.hypot((x-31.5)/31.5,(y-31.5)/31.5);a.set([0,0,0,Math.round(Math.max(0,1-d)**2*100)],i)}const shadowTex=new THREE.DataTexture(a,64,64);shadowTex.needsUpdate=true;const shadow=new THREE.Mesh(new THREE.PlaneGeometry(.95,.70),new THREE.MeshBasicMaterial({map:shadowTex,transparent:true,depthWrite:false}));shadow.rotation.x=-Math.PI/2;shadow.position.y=.001;scene.add(shadow);
const camera=new THREE.PerspectiveCamera(34,1,.01,50);camera.position.set(.9,.65,1.8);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.26,0);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=.7;controls.maxDistance=4;controls.maxPolarAngle=Math.PI*.49;controls.autoRotateSpeed=1.1;
let gear,pet,moving=false,last=0;function change(){if(gear){scene.remove(gear);const gs=new Set(),ms=new Set();gear.traverse(o=>{if(o.geometry)gs.add(o.geometry);if(o.material)ms.add(o.material)});gs.forEach(g=>g.dispose());ms.forEach(m=>m.dispose())}gear=buildLightCostume(THREE,'custom-none-none-'+select.value+'-none-none-none');pet=gear.userData.pet;pet.position.set(0,.26,0);scene.add(gear);history.replaceState(null,'','?pet='+select.value)}select.onchange=change;const query=new URLSearchParams(location.search).get('pet');if(Object.hasOwn(pets,query))select.value=query;change();document.getElementById('status').hidden=true;
document.getElementById('walk').onclick=e=>{moving=!moving;e.target.setAttribute('aria-pressed',String(moving));e.target.textContent=moving?'待機':'歩く'};document.getElementById('rotate').onclick=e=>{controls.autoRotate=!controls.autoRotate;e.target.setAttribute('aria-pressed',String(controls.autoRotate))};function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);resize();renderer.setAnimationLoop(t=>{const dt=Math.min(.05,(t-last)/1000||.016);last=t;if(document.hidden)return;pet.position.y=.26+animateCompanionGait(pet,moving?dt*.65:0,dt,moving,t);controls.update(dt);renderer.render(scene,camera)});
</script></body></html>
