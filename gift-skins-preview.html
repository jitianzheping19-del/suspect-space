<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ギフトスキン プレビュー</title><style>body{margin:0;background:#080b1b;color:white;font:16px system-ui}canvas{display:block}header{position:fixed;z-index:1;top:12px;left:12px;padding:12px;background:#0b1726d9;border:1px solid #70859d;border-radius:14px}select,button{font:16px system-ui;padding:8px;border-radius:8px;background:#24394b;color:white;border:1px solid #7499a7}label{display:block;margin-top:8px}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script></head><body><header><select id="skin" aria-label="スキン"></select><label><input id="moving" type="checkbox"> 移動中</label><label><input id="jumping" type="checkbox"> ジャンプ中</label><small>ドラッグで回転</small></header><script type="module">
import * as THREE from 'three';import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';import {GIFT_SKINS,createGiftSkin} from './premium-skins.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x080b1b);const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,50);camera.position.set(3.4,2.7,6.0);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.append(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1.30,0);controls.enableDamping=true;scene.add(new THREE.HemisphereLight(0xe4e9ff,0x252d4b,2.5));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(3,5,6);scene.add(light);const rim=new THREE.DirectionalLight(0xaca0ff,2);rim.position.set(-4,3,-4);scene.add(rim);const floor=new THREE.Mesh(new THREE.CylinderGeometry(1.85,1.95,.10,64),new THREE.MeshStandardMaterial({color:0x111d30,metalness:.8,roughness:.3}));floor.position.y=-.09;scene.add(floor);const rimRing=new THREE.Mesh(new THREE.TorusGeometry(1.83,.012,6,80),new THREE.MeshBasicMaterial({color:0x607a9f}));rimRing.rotation.x=Math.PI/2;rimRing.position.y=-.025;scene.add(rimRing);const character=new THREE.Group();scene.add(character);const suit=new THREE.MeshStandardMaterial({color:0x545a7f,roughness:.45});const body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.48,5,10),suit);body.position.y=1;character.add(body);const visor=new THREE.Mesh(new THREE.SphereGeometry(.35,16,10),new THREE.MeshStandardMaterial({color:0xa6e8ff,metalness:.45,roughness:.2}));visor.scale.set(1,.64,.48);visor.position.set(0,1.18,.43);character.add(visor);const legs=new THREE.CapsuleGeometry(.17,.24,3,8);for(const x of [-.24,.24]){const leg=new THREE.Mesh(legs,suit);leg.position.set(x,.25,0);character.add(leg);}const select=document.querySelector('#skin');for(const skin of GIFT_SKINS){const option=document.createElement('option');option.value=skin.id;option.textContent=skin.name;select.append(option)}let active;function change(){active?.dispose();active=createGiftSkin(THREE,select.value,{mobile:matchMedia('(pointer:coarse)').matches});character.add(active.group)}select.onchange=change;change();const moving=document.querySelector('#moving'),jumping=document.querySelector('#jumping');function frame(ms){requestAnimationFrame(frame);const t=ms/1000;active.update(t,{moving:moving.checked,jumping:jumping.checked});character.position.y=jumping.checked?Math.max(0,Math.sin(t*3))*.35:0;character.position.x=moving.checked?Math.sin(t*.8)*.50:0;character.rotation.y=moving.checked?Math.sin(t*.8)*.15:0;controls.update();renderer.render(scene,camera)}requestAnimationFrame(frame);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
