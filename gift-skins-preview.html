<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>課金装備 — SPACE SUSPECT</title>
<style>
:root{color-scheme:dark;--accent:#85e6d8}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#070c16;color:#f4f0e6;font:14px system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}button,select{font:inherit;color:inherit}button{cursor:pointer}header{position:fixed;top:max(22px,env(safe-area-inset-top));left:max(26px,env(safe-area-inset-left));z-index:2;max-width:44vw;pointer-events:none}header small{display:block;color:#9eadaf;font-size:10px;letter-spacing:.30em}header h1{margin:12px 0 7px;font-size:clamp(23px,3vw,36px);font-weight:550;letter-spacing:.08em}header .line{height:1px;width:140px;background:linear-gradient(90deg,var(--accent),transparent);margin:17px 0}select{pointer-events:auto;width:230px;max-width:40vw;border:1px solid #7791a247;border-radius:9px;background:#10202ce8;padding:10px 12px}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:4px}.edition{color:var(--accent);font-size:10px;letter-spacing:.2em}nav{position:fixed;left:24px;right:24px;bottom:max(22px,env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:flex-start;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px;z-index:2}nav:empty{display:none}nav button{flex:0 0 auto;width:150px;padding:14px 12px;border:1px solid #64808e50;border-radius:11px;background:linear-gradient(145deg,#15232de8,#0c1521ef);color:#9caaae;letter-spacing:.02em;transition:border-color .2s,color .2s,background .2s}nav button[aria-pressed=true]{color:#fff4db;border-color:var(--accent);background:linear-gradient(145deg,#26383fe8,#111b27ef);box-shadow:inset 0 1px #e3fdff20}aside{position:fixed;top:max(22px,env(safe-area-inset-top));right:max(24px,env(safe-area-inset-right));z-index:2;display:grid;gap:14px;justify-items:end}.segmented{display:flex;gap:2px;padding:4px;background:#0d1823e0;border:1px solid #57708044;border-radius:11px}.segmented button{border:0;background:transparent;padding:8px 13px;border-radius:7px;color:#94a6ac}.segmented [aria-pressed=true]{color:#fff2d6;background:#3e4f564d}.switches{display:flex;gap:13px;padding:8px 3px;color:#abbdbf;font-size:12px}.switches label{display:flex;gap:5px;align-items:center;cursor:pointer}.switches input{accent-color:var(--accent)}.views{position:fixed;right:24px;bottom:100px;z-index:2;display:flex;gap:7px}.views button{padding:8px 11px;border:1px solid #7791a247;border-radius:8px;background:#101e2be0;color:#a7b6bd;font-size:11px}body:not([data-tailored=true]) nav{display:none}body:not([data-tailored=true]) .views{bottom:24px}.dragHint{position:fixed;left:28px;bottom:102px;color:#7e969f;font-size:10px;letter-spacing:.12em;pointer-events:none}body:not([data-tailored=true]) .dragHint{bottom:28px}
@media(max-height:540px){header{top:16px;left:max(18px,env(safe-area-inset-left))}header h1{font-size:22px;margin:8px 0}header .line{margin:10px 0;width:95px}header small{font-size:8px}select{width:190px;padding:6px;font-size:12px}aside{top:14px;right:max(14px,env(safe-area-inset-right));gap:5px}.segmented button{padding:6px 10px;font-size:11px}.switches{font-size:10px;gap:8px}nav{bottom:max(12px,env(safe-area-inset-bottom));left:14px;right:14px;gap:6px}nav button{padding:10px 7px;font-size:10px}.views{bottom:65px;right:15px}.views button{padding:6px 9px;font-size:10px}.dragHint{bottom:74px;left:20px;font-size:9px}}
@media(max-width:580px){header{max-width:65vw}header h1{font-size:23px}aside{top:auto;bottom:148px;right:14px;gap:5px}.views{bottom:100px;right:14px}nav{flex-wrap:nowrap;left:12px;right:12px;bottom:14px}nav button{width:138px;font-size:10px;padding:10px 5px}.dragHint{bottom:115px;left:15px}.switches{font-size:10px}}
</style>
</head>
<body>
<header><small>SPACE SUSPECT / ATELIER</small><h1 id="skinTitle"></h1><span class="edition">SPECIAL COLLECTION</span><div class="line"></div><select id="skin" aria-label="スキン"></select></header>
<aside><div class="segmented" id="pose"><button data-pose="idle" aria-pressed="true">待機</button><button data-pose="walk" aria-pressed="false">歩く</button><button data-pose="jump" aria-pressed="false">ジャンプ</button></div><div class="segmented" id="context"><button data-context="game" aria-pressed="true">試合</button><button data-context="lobby" aria-pressed="false">ロビー</button></div><div class="switches"><label><input id="aura" type="checkbox" checked>オーラ</label><label><input id="rotate" type="checkbox">回転</label></div></aside>
<div class="views"><button data-view="front">正面</button><button data-view="side">横</button><button data-view="back">背面</button></div><small class="dragHint">DRAG TO ROTATE</small><nav id="collection" aria-label="スキンコレクション"></nav>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
import {GIFT_SKINS,createGiftSkin} from './premium-skins.js';
import {LEGEND_AURA_SKINS} from './premium-legend-skins.js';
import {TAILORED_GIFT_IDS} from './premium-tailored-skins.js';
const params=new URL(location.href).searchParams,curated=['tailored','remaining','golden','legend-aura'].includes(params.get('collection')),collectionIds=params.get('collection')==='legend-aura'?LEGEND_AURA_SKINS.map(s=>s.id):params.get('collection')==='golden'?GIFT_SKINS.filter(s=>s.rarity===5).map(s=>s.id):params.get('collection')==='remaining'?TAILORED_GIFT_IDS.slice(5):TAILORED_GIFT_IDS,mobile=matchMedia('(pointer:coarse)').matches;
document.body.dataset.tailored=String(curated);
const renderer=new THREE.WebGLRenderer({antialias:!mobile,powerPreference:'default',alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,mobile?1:1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x070c16);scene.fog=new THREE.Fog(0x070c16,8,20);
const camera=new THREE.PerspectiveCamera(34,1,.1,50);camera.position.set(0,2.15,6.7);camera.lookAt(0,1.03,0);
scene.add(new THREE.HemisphereLight(0xdbedf2,0x26374b,2.05));const key=new THREE.DirectionalLight(0xffe5c5,3.8);key.position.set(-3.8,5,5);scene.add(key);const fill=new THREE.DirectionalLight(0x88d7ee,1.35);fill.position.set(4,2,3);scene.add(fill);const rim=new THREE.DirectionalLight(0x8aa7ef,2.6);rim.position.set(2,4,-4);scene.add(rim);
const ground=new THREE.Mesh(new THREE.CircleGeometry(20,96),new THREE.MeshStandardMaterial({color:0x0c1824,roughness:.62,metalness:.35}));ground.rotation.x=-Math.PI/2;ground.position.y=-.055;scene.add(ground);
const dais=new THREE.Mesh(new THREE.CylinderGeometry(1.20,1.24,.045,80),new THREE.MeshStandardMaterial({color:0x14232c,roughness:.52,metalness:.6}));dais.position.y=-.04;scene.add(dais);const edge=new THREE.Mesh(new THREE.TorusGeometry(1.215,.006,5,96),new THREE.MeshBasicMaterial({color:0x455d6c}));edge.rotation.x=Math.PI/2;edge.position.y=-.017;scene.add(edge);
let character=null,baseResources=[],active=null,yaw=.38,pose='idle',context='game',frozen=false,freezeTime=0,lastFrame=-Infinity,drag=null;
function makeCharacter(){
 active?.dispose();active=null;character?.removeFromParent();for(const r of baseResources)r.dispose();baseResources=[];
 const g=new THREE.Group();scene.add(g);const suit=new THREE.MeshStandardMaterial({color:0x5b8495,roughness:.47,metalness:.08}),glass=new THREE.MeshPhysicalMaterial({color:0x9fdcf0,metalness:.45,roughness:.15,clearcoat:1});baseResources.push(suit,glass);
 const add=(geo,mat,x,y,z)=>{baseResources.push(geo);const n=new THREE.Mesh(geo,mat);n.position.set(x,y,z);g.add(n);return n;};
 const lobby=context==='lobby',radius=lobby?.43:.42,length=lobby?.55:.48,bodyY=lobby?1.05:1;const body=add(new THREE.CapsuleGeometry(radius,length,6,16),suit,0,bodyY,0);
 const visor=add(new THREE.SphereGeometry(lobby?1:.35,24,16),glass,0,lobby?1.23:1.18,.37);visor.scale.set(lobby?.37:1,lobby?.23:.64,lobby?.17:.48);
 const shine=add(new THREE.SphereGeometry(1,16,10),new THREE.MeshBasicMaterial({color:0xe4faff}),-.07,lobby?1.31:1.26,.518);baseResources.push(shine.material);shine.scale.set(.16,.038,.012);
 const legs=[],arms=[];for(const side of[-1,1]){
  const leg=add(new THREE.CapsuleGeometry(lobby?.18:.17,lobby?.26:.24,4,12),suit,side*(lobby?.23:.24),lobby?.32:.25,0);legs.push(leg);
  const arm=new THREE.Group();arm.position.set(side*(lobby?.47:.36),lobby?1.24:1.08,lobby?.04:.02);g.add(arm);const geo=new THREE.CapsuleGeometry(lobby?.10:.105,.30,5,12);baseResources.push(geo);const segment=new THREE.Mesh(geo,suit);segment.position.y=lobby?-.27:-.04;segment.rotation.z=side*.08;arm.add(segment);arms.push(arm);
 }
 g.userData={body,visor,legs,arms};character=g;
}
const select=document.querySelector('#skin'),nav=document.querySelector('#collection');for(const skin of GIFT_SKINS.filter(s=>!curated||collectionIds.includes(s.id))){const option=document.createElement('option');option.value=skin.id;option.textContent=skin.name;select.append(option);}
for(const id of collectionIds){const spec=GIFT_SKINS.find(s=>s.id===id),b=document.createElement('button');b.textContent=spec.name;b.dataset.skin=id;b.onclick=()=>choose(id);nav.append(b);}
function choose(id){if(!GIFT_SKINS.some(s=>s.id===id))return;select.value=id;active?.dispose();active=createGiftSkin(THREE,id,{mobile});character.add(active.group);const spec=active.spec;document.querySelector('#skinTitle').textContent=spec.name;document.querySelector('.edition').textContent=spec.rarity===5?'GOLDEN LEGEND RARE':'LEGEND RARE';document.documentElement.style.setProperty('--accent','#'+spec.accent.toString(16).padStart(6,'0'));nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.skin===id)));edge.material.color.set(spec.accent).multiplyScalar(.45);render(frozen?freezeTime:performance.now()/1000);}
function setPose(value){pose=value;document.querySelectorAll('[data-pose]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.pose===pose)));}
function render(t){if(!active)return;const walking=pose==='walk',jumping=pose==='jump',gait=walking?Math.sin(t*5.8)*.48:0;for(let j=0;j<2;j++){const side=j?1:-1;character.userData.legs[j].rotation.x=gait*side;character.userData.arms[j].rotation.x=-gait*side*.65;}
 character.position.set(walking?Math.sin(t*.9)*.13:0,jumping?Math.max(0,Math.sin(t*3))*.32:walking?Math.abs(Math.sin(t*5.8))*.015:0,0);character.rotation.y=yaw+(document.querySelector('#rotate').checked?t*.25:0);active.update(t,{moving:walking,jumping:jumping&&character.position.y>.03});const aura=active.group.getObjectByName('signature-aura');if(aura)aura.visible=document.querySelector('#aura').checked;scene.updateMatrixWorld(true);renderer.render(scene,camera);
}
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.position.z=w/h<.9?7.7:h<540?6.8:6.4;camera.updateProjectionMatrix();render(frozen?freezeTime:performance.now()/1000);}
select.onchange=()=>choose(select.value);document.querySelectorAll('[data-pose]').forEach(b=>b.onclick=()=>{setPose(b.dataset.pose);frozen=false;});document.querySelectorAll('[data-context]').forEach(b=>b.onclick=()=>{const id=select.value;context=b.dataset.context;document.querySelectorAll('[data-context]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));makeCharacter();choose(id);});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{yaw=b.dataset.view==='front'?0:b.dataset.view==='side'?Math.PI/2:Math.PI;document.querySelector('#rotate').checked=false;render(frozen?freezeTime:performance.now()/1000);});
renderer.domElement.addEventListener('pointerdown',e=>{drag={id:e.pointerId,x:e.clientX};renderer.domElement.setPointerCapture(e.pointerId);});renderer.domElement.addEventListener('pointermove',e=>{if(drag?.id!==e.pointerId)return;yaw+=(e.clientX-drag.x)*.008;drag.x=e.clientX;render(frozen?freezeTime:performance.now()/1000);});for(const type of['pointerup','pointercancel'])renderer.domElement.addEventListener(type,()=>drag=null);
makeCharacter();const requested=params.get('skin');choose(GIFT_SKINS.some(s=>s.id===requested)?requested:curated?collectionIds[0]:GIFT_SKINS[0].id);resize();
window.giftSkinPreview={select:choose,get active(){return active;},get camera(){return camera;},get renderer(){return renderer;},get character(){return character;},get scene(){return scene;},setContext(value){context=value;const id=select.value;makeCharacter();choose(id);},pose(){this.renderAt(3.7,{pose:'walk'});},renderAt(t,options={}){frozen=true;freezeTime=t;if(options.pose)setPose(options.pose);if(options.yaw!==undefined)yaw=options.yaw;document.querySelector('#rotate').checked=false;render(t);},setAura(on){document.querySelector('#aura').checked=on;render(frozen?freezeTime:performance.now()/1000);},stats(){let meshes=0,triangles=0,finite=true;active.group.traverse(o=>{if(o.isMesh){meshes++;triangles+=(o.geometry.index?o.geometry.index.count:o.geometry.attributes.position.count)/3;}if(o.geometry)for(const x of o.geometry.attributes.position.array)if(!Number.isFinite(x))finite=false;});const focus=new THREE.Vector3(0,1.03,0).project(camera);return{focus:focus.toArray(),meshes,triangles,finite,textures:renderer.info.memory.textures,geometries:renderer.info.memory.geometries,tailored:active.group.userData.tailoredRevision||0,bindings:active.group.userData.fitBindings?.()||[],calls:renderer.info.render.calls};}};
function frame(ms){requestAnimationFrame(frame);if(document.hidden||ms-lastFrame<(mobile?33:16.5)||frozen)return;lastFrame=ms;render(ms/1000);}requestAnimationFrame(frame);addEventListener('resize',resize);
</script>
</body>
</html>
