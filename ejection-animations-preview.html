  <style>

    .spinner{width:37px;height:37px;border:1px solid #8ce1e526;border-top-color:#b1f5f8;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .loader button{border:1px solid #8bc8dd55;background:#172b3d;padding:10px 18px;border-radius:9px}.flash{position:absolute;inset:0;background:#d7f6ff;opacity:0;pointer-events:none;z-index:2;mix-blend-mode:screen}
    .outcome{position:absolute;left:50%;top:50%;transform:translate(-50%,-38%);width:min(90%,900px);z-index:7;text-align:center;pointer-events:none;opacity:0;transition:opacity .8s ease,transform .8s ease;text-shadow:0 2px 10px #000,0 0 30px #000,0 6px 45px #000}
    .outcome.show{opacity:1;transform:translate(-50%,-50%)}.outcome strong{display:block;white-space:pre-line;overflow-wrap:anywhere;font-size:clamp(19px,3.3vw,42px);font-weight:850;line-height:1.45;letter-spacing:.025em}.outcome span{display:block;margin-top:15px;font-size:clamp(17px,2.6vw,31px);font-weight:700;color:#ffd9d4}

    @media(max-width:680px){.controlrow{flex-wrap:wrap}#balanceResult{order:10;flex-basis:100%;width:100%;max-width:none;height:30px}}
    @media(max-height:520px) and (orientation:landscape){.header{top:max(11px,env(safe-area-inset-top));left:max(17px,env(safe-area-inset-left));right:max(17px,env(safe-area-inset-right))}.emblem{height:28px;width:28px;font-size:18px}.title{font-size:12px}.eyebrow{font-size:7px}.tab{min-height:34px;padding:0 12px;font-size:10px}.phase{top:65px;left:18px;font-size:9px}.playback{bottom:max(9px,env(safe-area-inset-bottom));width:min(550px,calc(100% - 36px));padding:7px 12px;border-radius:12px}.seekrow{margin-bottom:4px}.iconbtn{height:32px}.controlrow{gap:7px}.mode-note{font-size:9px;line-height:1.3}}

<body>
<main id="app">
  <canvas id="scene" aria-label="追放アニメーションの3Dプレビュー"></canvas>
  <div class="vignette"></div>
  <header class="header">
    <div class="brand"><div class="emblem" aria-hidden="true">✧</div><div><p class="eyebrow">SPACE SUSPECT / MOTION STUDY</p><h1 class="title">追放アニメーション</h1></div></div>
    <nav class="tabs" role="tablist" aria-label="アニメーションの種類">
      <button class="tab" role="tab" data-mode="rocket" aria-selected="true"><span>01</span>ロケット</button>
      <button class="tab" role="tab" data-mode="collapse" aria-selected="false"><span>02</span>崩落</button>
      <button class="tab" role="tab" data-mode="balance" aria-selected="false"><span>03</span>天秤</button>
      <button class="tab" role="tab" data-mode="beam" aria-selected="false"><span>04</span>波動砲</button>
      <button class="tab" role="tab" data-mode="missile" aria-selected="false"><span>05</span>ミサイル</button>
      <button class="tab" role="tab" data-mode="meteor" aria-selected="false"><span>06</span>隕石</button>
    </nav>
  </header>
  <div class="phase"><small id="shot">01 / ROCKET</small><i></i><span id="phase">テーブルへ</span></div>
  <div class="flash" id="flash"></div>
  <div class="outcome" id="outcome" aria-live="polite"><strong id="disclosure"></strong><span id="wolves"></span></div>
  <section class="playback" aria-label="再生操作">
    <div class="seekrow"><time id="elapsed">0:00</time><input id="seek" type="range" min="0" max="14" step=".01" value="0" aria-label="再生位置"><time id="duration">0:14</time></div>
    <div class="controlrow">
      <button id="play" class="iconbtn" aria-label="一時停止">❚❚ 停止</button>
      <button id="replay" class="iconbtn" aria-label="最初から再生">↻</button>
      <div class="mode-note"><b id="modeTitle">ロケット・花火</b><br><span id="modeNote">拘束 → 打ち上げ → 追尾 → 花火</span></div>
      <select id="balanceResult" aria-label="天秤の投票結果" hidden><option value="left">左が最多</option><option value="both">同票・二人</option><option value="right">右が最多</option></select>
      <button id="sound" class="iconbtn sound" aria-label="音を有効にする" aria-pressed="false">音 OFF</button>
      <button id="fullscreen" class="iconbtn" aria-label="全画面">⛶</button>
    </div>
  </section>
  <div id="loader" class="loader"><div class="spinner"></div><span id="loadingText">3Dシーンを準備中</span></div>
</main>
<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import RAPIER from 'https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.17.3/+esm';

const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const mix=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,t)=>{const u=clamp((t-a)/(b-a));return u*u*(3-2*u);};
const easeOut=t=>1-Math.pow(1-clamp(t),3);
function random(seed){let a=seed>>>0;return()=>{a+=0x6D2B79F5;let v=Math.imul(a^a>>>15,1|a);v^=v+Math.imul(v^v>>>7,61|v);return((v^v>>>14)>>>0)/4294967296;};}
const rng=random(621);
const TAU=Math.PI*2,TABLE_Y=1.42,BREAK_AT=3.15,LAUNCH_AT=4.45,EXPLODE_AT=7.85;
const EMBEDDED=document.documentElement.hasAttribute('data-embedded'),BALANCE_DROP_AT=3.65;
const MODES={
  rocket:{duration:14,title:'ロケット・花火',note:'拘束 → 打ち上げ → 追尾 → 花火',shot:'01 / ROCKET'},
  collapse:{duration:11.5,title:'テーブル崩落',note:'亀裂 → 物理崩壊 → 奈落へ',shot:'02 / COLLAPSE'},
  balance:{duration:12,title:'天秤・断罪',note:'土台以外を破壊 → 重い皿の鎖が切れる',shot:'03 / BALANCE'},
  beam:{duration:9.5,title:'一点集中・波動砲',note:'横から一人分の細いビームで追放',shot:'04 / PRECISION BEAM'},
  missile:{duration:10.5,title:'ミサイル爆破',note:'飛来 → 直撃 → 机ごと物理爆破',shot:'05 / MISSILE'},
  meteor:{duration:10,title:'隕石・圧壊',note:'隕石が飛来 → テーブル上で押し潰される',shot:'06 / METEOR'}
};
let mode=Object.hasOwn(MODES,new URLSearchParams(location.search).get('mode'))?new URLSearchParams(location.search).get('mode'):'rocket';
const breakAt=()=>mode==='balance'?.12:mode==='missile'?3.35:BREAK_AT;
const destructive=()=>['collapse','balance','missile'].includes(mode);
let balanceVotes=[4,2],balanceFalls=[true,false],balanceFallsActive=false;
let configuredParticipants=null,configuredDisclosure=null,configuredWolves=1,configuredShowWolves=true,costumeBuilder=null;
let seekingNow=false;
let time=0,playing=true,ready=false,lastFrame=0,completed=false,soundOn=false,scrubbing=false,resumeAfterScrub=false;
let physics=null,physicsStep=0,actorBody=null,secondActorBody=null,worldBuilds=0,frameCount=0;
const bodies=[],dynamicProps=[],shardMeshes=[],shardSpecs=[],crackLines=[],spectators=[],aperture=[];

const renderer=new THREE.WebGLRenderer({canvas:$('scene'),antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,innerWidth<800?1.5:1.8));
renderer.setSize(innerWidth,innerHeight,false);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
const scene=new THREE.Scene();scene.background=new THREE.Color('#030711');scene.fog=new THREE.FogExp2('#06101d',.0045);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.075,500);
const pmrem=new THREE.PMREMGenerator(renderer),environment=new RoomEnvironment();
scene.environment=pmrem.fromScene(environment,.04).texture;environment.dispose();pmrem.dispose();
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.33,.5,1.35);composer.addPass(bloom);composer.addPass(new OutputPass());
scene.add(new THREE.HemisphereLight(0xc5e6f3,0x152332,1.1));
const key=new THREE.DirectionalLight(0xffead6,2.2);key.position.set(3,14,8);key.castShadow=true;key.shadow.mapSize.set(1024,1024);
Object.assign(key.shadow.camera,{left:-14,right:14,top:14,bottom:-14,near:1,far:42});key.shadow.normalBias=.035;key.shadow.bias=-.00025;scene.add(key,key.target);
const rim=new THREE.DirectionalLight(0x8ad9ff,1.0);rim.position.set(-8,5,-12);scene.add(rim);
const tableLight=new THREE.PointLight(0x7ad6e3,4,15,2);tableLight.position.set(0,5.5,0);scene.add(tableLight);
const engineLight=new THREE.PointLight(0x65dfff,0,18,2);scene.add(engineLight);
const burstLight=new THREE.PointLight(0xffdba4,0,55,2);scene.add(burstLight);

const mats={
  floor:new THREE.MeshStandardMaterial({color:0x142633,metalness:.35,roughness:.7}),
  edge:new THREE.MeshStandardMaterial({color:0x15242d,metalness:.78,roughness:.3}),
  steel:new THREE.MeshStandardMaterial({color:0x77939f,metalness:.82,roughness:.26}),
  dark:new THREE.MeshStandardMaterial({color:0x0b1822,metalness:.65,roughness:.38}),
  trim:new THREE.MeshStandardMaterial({color:0x526b77,metalness:.82,roughness:.31}),
  cyan:new THREE.MeshStandardMaterial({color:0x79d5e7,emissive:0x4ac9e6,emissiveIntensity:2.1,roughness:.3}),
  warm:new THREE.MeshStandardMaterial({color:0xf6dbac,emissive:0xf0b76c,emissiveIntensity:1.3}),
  glass:new THREE.MeshPhysicalMaterial({color:0x287286,transparent:true,opacity:.14,metalness:.2,roughness:.12,side:THREE.DoubleSide}),
  cut:new THREE.MeshStandardMaterial({color:0x34434a,roughness:.73,metalness:.52}),
  shaft:new THREE.MeshStandardMaterial({color:0x09111c,roughness:.8,metalness:.24,side:THREE.BackSide})
};
for(const material of Object.values(mats))material.envMapIntensity=.35;
function mesh(geometry,material,parent=scene){const m=new THREE.Mesh(geometry,material);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;}
function box(w,h,d,material,parent=scene,x=0,y=0,z=0){const m=mesh(new THREE.BoxGeometry(w,h,d),material,parent);m.position.set(x,y,z);return m;}
function ring(radius,tube,material,parent=scene,y=0){const m=mesh(new THREE.TorusGeometry(radius,tube,8,96),material,parent);m.rotation.x=Math.PI/2;m.position.y=y;return m;}
function line(points,color,opacity=1,parent=scene){const g=new THREE.BufferGeometry().setFromPoints(points.map(p=>new THREE.Vector3(...p)));const m=new THREE.Line(g,new THREE.LineBasicMaterial({color,transparent:true,opacity}));parent.add(m);return m;}
function prism(points,height,centerX=0,centerZ=0){
  const positions=[],normals=[],uv=[],groups=[];
  function triangle(a,b,c,material){
    const offset=positions.length/3,v1=new THREE.Vector3(...a),v2=new THREE.Vector3(...b),v3=new THREE.Vector3(...c),normal=v2.clone().sub(v1).cross(v3.clone().sub(v1)).normalize();
    for(const p of[a,b,c]){positions.push(...p);normals.push(normal.x,normal.y,normal.z);uv.push((p[0]+centerX)/7.3+.5,.5-(p[2]+centerZ)/7.3);}
    groups.push([offset,3,material]);
  }
  const top=points.map(p=>[p[0]-centerX,height/2,p[1]-centerZ]),bottom=points.map(p=>[p[0]-centerX,-height/2,p[1]-centerZ]);
  for(let i=1;i<points.length-1;i++){triangle(top[0],top[i+1],top[i],0);triangle(bottom[0],bottom[i],bottom[i+1],1);}
  for(let i=0;i<points.length;i++){const j=(i+1)%points.length;triangle(top[i],top[j],bottom[j],1);triangle(top[i],bottom[j],bottom[i],1);}
  const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));geometry.setAttribute('normal',new THREE.Float32BufferAttribute(normals,3));geometry.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  for(const group of groups)geometry.addGroup(...group);return geometry;
}

// The room is deliberately open toward the preview camera, with a real launch aperture.
const room=new THREE.Group();scene.add(room);
const floor=mesh(new THREE.RingGeometry(4.13,12,96),mats.floor,room);floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;
const floorCap=mesh(new THREE.CircleGeometry(4.14,64),mats.floor,room);floorCap.rotation.x=-Math.PI/2;floorCap.position.y=-.005;
const hull=mesh(new THREE.CylinderGeometry(12,11.8,.5,96,1,true),mats.dark,room);hull.position.y=-.25;
ring(11.8,.05,mats.steel,room,.04);ring(9.2,.018,mats.trim,room,.013);ring(4.18,.055,mats.trim,room,.015);
for(let i=0;i<32;i++){
  const a=i/32*TAU;
  const tick=box(.055,.009,.6,i%4?mats.trim:mats.cyan,room,Math.sin(a)*9.9,.012,Math.cos(a)*9.9);tick.rotation.y=a;
  if(i%2===0)line([[Math.sin(a)*5.8,.013,Math.cos(a)*5.8],[Math.sin(a)*8.8,.013,Math.cos(a)*8.8]],0x4a6c7b,.24,room);
}
for(let i=0;i<=12;i++){
  const a=Math.PI/2+i/12*Math.PI,x=Math.sin(a)*11.6,z=Math.cos(a)*11.6;
  const column=box(.16,6.5,.24,mats.steel,room,x,3.25,z);column.rotation.y=a;
  const lamp=box(.05,3.8,.07,mats.cyan,room,x*.992,3.8,z*.992);lamp.rotation.y=a;
  if(i<12){
    const mid=a+Math.PI/24,xx=Math.sin(mid)*11.5,zz=Math.cos(mid)*11.5;
    const base=box(2.92,1.05,.28,mats.dark,room,xx,.52,zz);base.rotation.y=mid;
    const window=box(2.88,4.6,.045,mats.glass,room,xx,3.4,zz);window.rotation.y=mid;
    const cornice=box(2.96,.3,.5,mats.edge,room,xx,5.86,zz);cornice.rotation.y=mid;
  }
}
const roof=mesh(new THREE.RingGeometry(7.3,12.1,96),new THREE.MeshStandardMaterial({color:0x152b3b,metalness:.7,roughness:.4,side:THREE.DoubleSide}),room);roof.rotation.x=Math.PI/2;roof.position.y=8.05;
ring(7.35,.055,mats.cyan,room,8.02);ring(11.7,.11,mats.steel,room,8.04);
const hatch=new THREE.Group();hatch.position.y=8.02;room.add(hatch);
for(let i=0;i<8;i++){
  const a=i/8*TAU,b=(i+1)/8*TAU,r=3.25,pts=[[0,0],[Math.cos(a)*r,Math.sin(a)*r],[Math.cos(b)*r,Math.sin(b)*r]];
  const panel=mesh(prism(pts,.12),mats.trim,hatch);panel.userData.angle=(a+b)/2;aperture.push(panel);
}

  }
}
$('balanceResult').addEventListener('change',event=>{const v=event.target.value;balanceVotes=v==='both'?[4,4]:v==='left'?[4,2]:[2,4];balanceFalls=[v!=='right',v!=='left'];configuredDisclosure=null;reset('balance',true);});
window.EjectionAnimations={
  play(type=mode,options={}){if(options.color!==undefined)actor.suit.color.set(options.color);if(options.secondColor!==undefined)secondActor.suit.color.set(options.secondColor);configureAnimation(options);reset(Object.hasOwn(MODES,type)?type:'rocket',true);if(Number(options.startAt)>0)seek(Number(options.startAt));},
  pause(){setPlaying(false);},resume(){setPlaying(true);},seek,reset(){reset(mode,false);},
  getState(){return{ready,mode,time,duration:MODES[mode].duration,playing,completed,physics:!!physics,physicsStep,worldBuilds,fragments:shardMeshes.length,frameCount,actorPosition:actor.root.position.toArray(),secondActorPosition:secondActor.root.position.toArray(),cameraPosition:camera.position.toArray()};}
};
window.addEventListener('message',event=>{if(event.source!==parent)return;const data=event.data;if(data?.type==='ss-ejection-play')window.EjectionAnimations.play(data.mode,data.options||{color:data.color});});
try{
  await RAPIER.init();ready=true;reset(mode,!EMBEDDED);resize();$('loader').hidden=true;if(EMBEDDED)parent.postMessage({type:'ss-ejection-ready'},'*');
  window.dispatchEvent(new Event('ejection-ready'));requestAnimationFrame(animate);
}catch(error){
  console.error(error);$('loader').querySelector('.spinner').remove();$('loadingText').textContent='3Dライブラリを読み込めませんでした。通信を確認して再読み込みしてください。';
  const button=document.createElement('button');button.textContent='再読み込み';button.addEventListener('click',()=>location.reload());$('loader').append(button);
}
</script>
</body>
</html>
