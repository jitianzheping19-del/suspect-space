<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>追放アニメーション</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030812;color:#e8f8fc;font-family:system-ui,sans-serif}iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.top{position:fixed;z-index:2;top:max(10px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));display:flex;gap:6px;align-items:center;overflow:auto;padding:7px;background:#071725ee;border:1px solid #3a586c;border-radius:13px;scrollbar-width:none}button{font:700 13px system-ui;color:#d6e9ed;background:#142b3d;border:1px solid #476378;border-radius:9px;padding:10px 13px;white-space:nowrap;cursor:pointer;touch-action:manipulation}button[aria-selected=true]{background:#1c625f;border-color:#84e3d5;color:white}.bottom{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:2;display:flex;align-items:center;gap:12px;padding:9px 13px;background:#071725ee;border:1px solid #3a586c;border-radius:12px}#clock{font-size:13px;font-variant-numeric:tabular-nums;min-width:70px;text-align:center}#seek{width:min(33vw,260px);accent-color:#84e3d5}#error{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:14px;z-index:5}@media(max-height:500px){button{font-size:11px;padding:7px 10px}.top{top:5px;padding:5px}.bottom{bottom:6px;padding:6px 10px}}
</style></head><body><iframe id="meeting" title="追放アニメーション" src="./ejection-meeting-preview.html"></iframe><nav class="top" aria-label="追放演出"></nav><div class="bottom"><button id="play">一時停止</button><button id="restart">もう一度</button><input id="seek" type="range" min="0" max="8" step=".01" value="0" aria-label="再生位置"><span id="clock">0.0 / 7.6</span></div><div id="error">読み込み中</div><script type="module">
const modes={cat:'道連れ',gravity:'重力反転',pod:'追放ポッド',ice:'氷結追放',singularity:'ブラックホール',crane:'貨物クレーン',ufo:'UFO',rocket:'ロケット',collapse:'床崩壊',beam:'ビーム',missile:'ミサイル',meteor:'隕石',balance:'天秤'};let mode=new URLSearchParams(location.search).get('mode')||'gravity',paused=false,ready=false;const frame=document.querySelector('iframe'),send=data=>frame.contentWindow.postMessage(data,'*');
for(const [key,name]of Object.entries(modes)){const b=document.createElement('button');b.textContent=name;b.dataset.mode=key;b.onclick=()=>select(key);document.querySelector('nav').append(b)}
function select(key){mode=Object.hasOwn(modes,key)?key:'gravity';paused=false;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.mode===mode)));document.getElementById('play').textContent='一時停止';if(ready)send({type:'ejection-preview-mode',mode});history.replaceState(null,'','?mode='+mode)}
addEventListener('message',event=>{if(event.source!==frame.contentWindow)return;const d=event.data||{};if(d.type==='ejection-preview-ready'){ready=true;document.getElementById('error').hidden=true;select(mode)}if(d.type==='ejection-preview-state'){const duration=d.finishAt||7.55,t=Math.min(duration,d.elapsed||0);document.getElementById('seek').max=duration;document.getElementById('seek').value=t;document.getElementById('clock').textContent=t.toFixed(1)+' / '+duration.toFixed(1)}});
document.getElementById('play').onclick=()=>{paused=!paused;send({type:'ejection-preview-pause',paused});document.getElementById('play').textContent=paused?'再生':'一時停止'};document.getElementById('restart').onclick=()=>select(mode);document.getElementById('seek').oninput=event=>{paused=true;document.getElementById('play').textContent='再生';send({type:'ejection-preview-seek',time:Number(event.target.value)})};select(mode);
</script></body></html>
